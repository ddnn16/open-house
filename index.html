<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <!-- RWD：讓手機依照裝置寬度顯示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>國立中山大學 OPEN HOUSE 校園開放日</title>

    <!-- 引入 CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- =========================
             活動主視覺
        ========================== -->
        <header class="hero">

            <img
                src="images/open-house.png"
                alt="國立中山大學 OPEN HOUSE 校園開放日"
                class="hero-image"
            >

             <!-- <div class="event-info">
                <p class="event-date">2026 / 11 / 14（六）</p>
                <p>09:00 - 15:30</p>
                <p>地點｜國立中山大學</p>
            </div>-->

        </header>


        <!-- =========================
             報名區域
        ========================== -->
        <section class="registration">
            <h1>選擇您的報名活動</h1>
            <p class="registration-description">
                請依照您的身分選擇適合的活動進行報名
            </p>

            <!-- 兩個活動卡片的容器 -->
            <div class="activity-list">

                <!-- 一般民眾 -->
                <div class="activity-card">

                    <span class="tag">開放報名</span>

                    <h2>中山開麥啦：教授親自說</h2>

                    <h3>科普專題講座</h3>

                    <!--<p class="activity-description">
                        歡迎學生參加
                    </p>-->

                    <a
                        href="https://nsysu.surveycake.biz/s/WyGlZ"
                        class="register-button"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        點我報名
                    </a>

                </div>


                <!-- 高中生 -->
                <div class="activity-card">

                    <span class="tag">高中生限定</span>

                    <h2>高中生限定：中山熱門體驗課</h2>

                    <p class="activity-description">
                        本活動限高中生報名
                    </p>

                    <a
                        href="https://nsysu.surveycake.biz/s/r1Gvd"
                        class="register-button"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        點我報名
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         Footer
    ========================== -->
    <footer>
        <p>國立中山大學 OPEN HOUSE 校園開放日</p>
    </footer>

</body>

</html>
